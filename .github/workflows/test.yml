name: Test epidemic watch
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: pilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:disposable_ci_password@127.0.0.1:5432/pilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m unittest discover -s tests -p 'test_official*.py' -v
      - working-directory: plugin
        run: |
          npm run build
          git diff --exit-code -- client.js
          npm test
          npm pack --dry-run
